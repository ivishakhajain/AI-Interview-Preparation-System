<!DOCTYPE html>
<html>
<head>
    <title>Resume Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container text-center mt-5">

    <h2 class="text-success">Resume Analysis Result</h2>

    <h4>Detected Skills:</h4>
    
    <h3 class="text-warning mt-3">
    Resume Match Score: {{ match_score }}%
</h3>

    {% for s in skills %}
        <span class="btn btn-primary m-1">{{ s }}</span>
    {% endfor %}

    <br><br>

    <a href="/interview" class="btn btn-success">
        Start Interview
    </a>

</div>

</body>
</html>
